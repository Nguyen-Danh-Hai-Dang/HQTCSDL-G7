name: Generator validation

on:
  push:
    branches:
      - fix/generator-w1-parity
  pull_request:
    branches:
      - main

jobs:
  generator-pilot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run generator integrity test
        run: python tests/test_generator_w1.py
