name: Build final project package

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Build submission ZIP
        run: |
          zip -r INT3401_11_Nhom14.zip . \
            -x ".git/*" \
               "data/*" \
               "benchmark/results/*" \
               "**/__pycache__/*" \
               "**/*.pyc" \
               ".venv/*" \
               "venv/*" \
               "node_modules/*" \
               "INT3401_11_Nhom14.zip"
          unzip -l INT3401_11_Nhom14.zip

      - name: Upload submission package
        uses: actions/upload-artifact@v4
        with:
          name: final-submission-package
          path: INT3401_11_Nhom14.zip
          if-no-files-found: error
          retention-days: 30
