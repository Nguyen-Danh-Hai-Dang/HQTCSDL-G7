name: Sync Word report

on:
  push:
    branches: [main]
    paths:
      - "scripts/sync_report_docx.py"
      - ".github/workflows/sync-report-docx.yml"

permissions:
  contents: write

jobs:
  sync-docx:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install python-docx
        run: python -m pip install python-docx

      - name: Synchronize Word report
        run: python scripts/sync_report_docx.py

      - name: Commit updated Word report
        run: |
          if git diff --quiet -- report/bao_cao_HQTCSDL_G7.docx; then
            echo "Word report is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add report/bao_cao_HQTCSDL_G7.docx
          git commit -m "docs: sync Word report with CI validation"
          git push origin HEAD:main
